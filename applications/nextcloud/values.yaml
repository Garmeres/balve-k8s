nextcloud:
  nextcloud:
    host: balve.garmeres.com
    existingSecret:
      enabled: true
      secretName: nextcloud-admin
      usernameKey: username
      passwordKey: password
      smtpUsernameKey: smtp-username
      smtpPasswordKey: smtp-password

    # S3 primary objectstore (replaces local file storage)
    objectStore:
      s3:
        enabled: true
        host: hel1.your-objectstorage.com
        port: 443
        ssl: true
        region: hel1
        bucket: balve-nextcloud
        usePathStyle: true
        autoCreate: false
        existingSecret: nextcloud-s3
        secretKeys:
          accessKey: S3_ACCESS_KEY_ID
          secretKey: S3_SECRET_ACCESS_KEY

    mail:
      enabled: true
      fromAddress: balve
      domain: garmeres.com
      smtp:
        host: smtp.domeneshop.no
        secure: ssl
        port: 465
        authtype: LOGIN

    configs:
      proxy.config.php: |-
        <?php
        $CONFIG = array (
          'trusted_proxies' => array(
            0 => '127.0.0.1',
            1 => '10.0.0.0/8',
          ),
          'forwarded_for_headers' => array('HTTP_X_FORWARDED_FOR'),
          'overwriteprotocol' => 'https',
          'trusted_domains' => array(
            0 => 'balve.garmeres.com',
            1 => 'localhost',
            2 => 'nextcloud.nextcloud.svc.cluster.local',
          ),
          'overwrite.cli.url' => 'https://balve.garmeres.com',
        );

  ingress:
    enabled: true
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      traefik.ingress.kubernetes.io/router.middlewares: nextcloud-nextcloud-body-size@kubernetescrd
    tls:
      - secretName: nextcloud-tls
        hosts:
          - balve.garmeres.com

  # Internal SQLite off — using MariaDB
  internalDatabase:
    enabled: false

  externalDatabase:
    enabled: true
    type: mysql
    host: nextcloud-mariadb
    database: nextcloud
    user: nextcloud
    existingSecret:
      enabled: true
      secretName: nextcloud-mariadb
      passwordKey: mariadb-password

  mariadb:
    enabled: true
    auth:
      database: nextcloud
      username: nextcloud
      existingSecret: nextcloud-mariadb
    primary:
      persistence:
        enabled: true
        size: 1Gi

  # Nextcloud app persistence (config, apps — not user files)
  persistence:
    enabled: true
    size: 2Gi

  cronjob:
    enabled: true

  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

  startupProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 30

  lifecycle:
    postStartCommand:
      - /bin/sh
      - -c
      - >-
        for app in
        calendar
        drop_account
        event_update_notification
        external
        forms
        group_everyone
        impersonate
        passwords
        polls
        richdocuments
        side_menu
        suspicious_login
        twofactor_admin
        twofactor_nextcloud_notification
        twofactor_totp
        twofactor_webauthn;
        do su -s /bin/sh www-data -c "php occ app:install $app" 2>/dev/null || true;
        done

  phpClientHttpsFix:
    enabled: true
    protocol: https

  collabora:
    enabled: true
    collabora:
      aliasgroups:
        - host: "https://balve.garmeres.com"
      extra_params: "--o:ssl.enable=false --o:ssl.termination=true"
      server_name: collabora.balve.garmeres.com
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
      hosts:
        - host: collabora.balve.garmeres.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: collabora-tls
          hosts:
            - collabora.balve.garmeres.com
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 1Gi
        cpu: 1
    probes:
      startup:
        enabled: true
        failureThreshold: 60
        periodSeconds: 5
      liveness:
        enabled: true
        initialDelaySeconds: 0
        periodSeconds: 10
        timeoutSeconds: 30
        successThreshold: 1
        failureThreshold: 4
      readiness:
        enabled: true
        initialDelaySeconds: 0
        periodSeconds: 10
        timeoutSeconds: 30
        successThreshold: 1
        failureThreshold: 2
