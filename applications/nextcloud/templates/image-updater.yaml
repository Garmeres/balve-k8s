apiVersion: v1
kind: ServiceAccount
metadata:
  name: image-updater
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: image-updater
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "patch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: image-updater
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: image-updater
subjects:
- kind: ServiceAccount
  name: image-updater
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-image-updater
spec:
  schedule: "0 0 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: image-updater
          containers:
          - name: check
            image: bitnami/kubectl:latest
            command: ["/bin/sh"]
            args:
            - -c
            - |
              set -e

              # Get the remote digest from Docker Hub
              TOKEN=$(curl -sf "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/nextcloud:pull" | sed 's/.*"token":"\([^"]*\)".*/\1/')
              REMOTE=$(curl -sf -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
                -D - -o /dev/null \
                "https://registry-1.docker.io/v2/library/nextcloud/manifests/stable-apache" \
                | grep -i docker-content-digest | awk '{print $2}' | tr -d '\r')

              if [ -z "$REMOTE" ]; then
                echo "ERROR: Could not fetch remote digest"
                exit 1
              fi

              # Get the running image ID
              RUNNING=$(kubectl get pods -l app.kubernetes.io/name=nextcloud \
                -o jsonpath='{.items[0].status.containerStatuses[?(@.name=="nextcloud")].imageID}')

              echo "Remote:  $REMOTE"
              echo "Running: $RUNNING"

              if echo "$RUNNING" | grep -q "$REMOTE"; then
                echo "Up to date — no restart needed"
              else
                echo "New image detected — restarting deployment"
                kubectl rollout restart deployment/nextcloud
              fi
          restartPolicy: Never
