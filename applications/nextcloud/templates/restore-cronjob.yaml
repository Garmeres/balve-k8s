apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-restore
spec:
  suspend: true
  schedule: "0 0 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: nextcloud-restore
        spec:
          restartPolicy: Never
          containers:
            - name: restore
              image: alpine:3.20
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  S3_ENDPOINT="https://{{ .Values.backupS3.host }}"
                  S3_REGION="{{ .Values.backupS3.region }}"
                  BUCKET="s3://{{ .Values.backupS3.bucket }}/backups"
                  apk add --no-cache mariadb-client aws-cli

                  echo "Available backups:"
                  aws s3 ls "$BUCKET/" --endpoint-url "$S3_ENDPOINT" --region "$S3_REGION" | grep 'nextcloud-backup-'

                  BACKUP_DATE="$RESTORE_DATE"
                  if [ "$BACKUP_DATE" = "latest" ]; then
                    BACKUP_DATE=$(aws s3 ls "$BUCKET/" --endpoint-url "$S3_ENDPOINT" --region "$S3_REGION" | \
                      awk '{print $4}' | grep '^nextcloud-backup-' | sed 's/nextcloud-backup-\([0-9]\{8\}\).*/\1/' | sort | tail -1)
                  fi

                  if [ -z "$BACKUP_DATE" ]; then
                    echo "ERROR: No backups found!"
                    exit 1
                  fi

                  BACKUP_FILE="nextcloud-backup-${BACKUP_DATE}.tar.gz"

                  echo "Downloading: $BACKUP_FILE"
                  aws s3 cp "$BUCKET/$BACKUP_FILE" /tmp/backup.tar.gz \
                    --endpoint-url "$S3_ENDPOINT" --region "$S3_REGION"

                  echo "Extracting backup..."
                  tar xzf /tmp/backup.tar.gz -C /tmp

                  # Restore database
                  echo "Dropping and recreating database..."
                  mysql -h "{{ .Release.Name }}-mariadb" -u nextcloud -p"$DB_PASS" \
                    -e "DROP DATABASE IF EXISTS nextcloud; CREATE DATABASE nextcloud;"

                  echo "Importing database..."
                  mysql -h "{{ .Release.Name }}-mariadb" -u nextcloud -p"$DB_PASS" nextcloud < /tmp/nextcloud.sql

                  # Restore config.php
                  echo "Restoring config.php..."
                  mkdir -p /nextcloud-data/config
                  cp /tmp/config.php /nextcloud-data/config/config.php
                  chown 33:33 /nextcloud-data/config/config.php

                  # Create data directory marker
                  mkdir -p /nextcloud-data/data
                  echo "# Nextcloud data directory" > /nextcloud-data/data/.ncdata
                  chown 33:33 /nextcloud-data/data /nextcloud-data/data/.ncdata

                  echo "Restore complete. Scale the deployment back up."
              env:
                - name: RESTORE_DATE
                  value: "latest"
                - name: DB_PASS
                  valueFrom:
                    secretKeyRef:
                      name: "{{ .Release.Name }}-mariadb"
                      key: mariadb-password
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backupS3.existingSecret }}
                      key: {{ .Values.backupS3.secretKeys.accessKey }}
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backupS3.existingSecret }}
                      key: {{ .Values.backupS3.secretKeys.secretKey }}
              volumeMounts:
                - name: nextcloud-data
                  mountPath: /nextcloud-data
              resources:
                requests:
                  memory: 64Mi
                  cpu: 50m
                limits:
                  memory: 256Mi
                  cpu: 200m
          volumes:
            - name: nextcloud-data
              persistentVolumeClaim:
                claimName: nextcloud-nextcloud
