apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-db-restore
spec:
  suspend: true
  schedule: "0 0 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: nextcloud-db-restore
        spec:
          restartPolicy: Never
          containers:
            - name: restore
              image: alpine:3.20
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  S3_ENDPOINT="https://{{ .Values.nextcloud.nextcloud.objectStore.s3.host }}"
                  S3_REGION="{{ .Values.nextcloud.nextcloud.objectStore.s3.region }}"
                  BUCKET="s3://{{ .Values.nextcloud.nextcloud.objectStore.s3.bucket }}/backups"
                  apk add --no-cache mariadb-client aws-cli

                  echo "Available backups:"
                  aws s3 ls "$BUCKET/" --endpoint-url "$S3_ENDPOINT" --region "$S3_REGION" | grep 'nextcloud-'

                  if [ "$BACKUP_FILE" = "latest" ]; then
                    BACKUP_FILE=$(aws s3 ls "$BUCKET/" --endpoint-url "$S3_ENDPOINT" --region "$S3_REGION" | \
                      awk '{print $4}' | grep '^nextcloud-' | sort | tail -1)
                  fi

                  if [ -z "$BACKUP_FILE" ]; then
                    echo "ERROR: No backups found!"
                    exit 1
                  fi

                  echo "Restoring from: $BACKUP_FILE"
                  aws s3 cp "$BUCKET/$BACKUP_FILE" /tmp/backup.sql.gz \
                    --endpoint-url "$S3_ENDPOINT" --region "$S3_REGION"

                  echo "Dropping and recreating database..."
                  mysql -h "{{ .Release.Name }}-mariadb" -u nextcloud -p"$DB_PASS" \
                    -e "DROP DATABASE IF EXISTS nextcloud; CREATE DATABASE nextcloud;"

                  echo "Importing backup..."
                  gunzip -c /tmp/backup.sql.gz | \
                    mysql -h "{{ .Release.Name }}-mariadb" -u nextcloud -p"$DB_PASS" nextcloud

                  echo "Restore complete. Scale the deployment back up."
              env:
                - name: BACKUP_FILE
                  value: "latest"
                - name: DB_PASS
                  valueFrom:
                    secretKeyRef:
                      name: "{{ .Release.Name }}-mariadb"
                      key: mariadb-password
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.nextcloud.nextcloud.objectStore.s3.existingSecret }}
                      key: {{ .Values.nextcloud.nextcloud.objectStore.s3.secretKeys.accessKey }}
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.nextcloud.nextcloud.objectStore.s3.existingSecret }}
                      key: {{ .Values.nextcloud.nextcloud.objectStore.s3.secretKeys.secretKey }}
              resources:
                requests:
                  memory: 64Mi
                  cpu: 50m
                limits:
                  memory: 256Mi
                  cpu: 200m
