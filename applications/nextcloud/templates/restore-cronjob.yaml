apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-restore
spec:
  suspend: true
  schedule: "0 0 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: nextcloud-restore
        spec:
          restartPolicy: Never
          containers:
            - name: restore
              image: alpine:3.20
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  S3_ENDPOINT="https://{{ .Values.backupS3.host }}"
                  S3_REGION="{{ .Values.backupS3.region }}"
                  BUCKET="s3://{{ .Values.backupS3.bucket }}/backups"
                  apk add --no-cache mariadb-client aws-cli

                  echo "Available backups:"
                  aws s3 ls "$BUCKET/" --endpoint-url "$S3_ENDPOINT" --region "$S3_REGION" | grep 'nextcloud-backup-'

                  BACKUP_DATE="$RESTORE_DATE"
                  if [ "$BACKUP_DATE" = "latest" ]; then
                    BACKUP_DATE=$(aws s3 ls "$BUCKET/" --endpoint-url "$S3_ENDPOINT" --region "$S3_REGION" | \
                      awk '{print $4}' | grep '^nextcloud-backup-' | sed 's/nextcloud-backup-\([0-9]\{8\}\).*/\1/' | sort | tail -1)
                  fi

                  if [ -z "$BACKUP_DATE" ]; then
                    echo "ERROR: No backups found!"
                    exit 1
                  fi

                  BACKUP_FILE="nextcloud-backup-${BACKUP_DATE}.tar.gz"

                  echo "Downloading: $BACKUP_FILE"
                  aws s3 cp "$BUCKET/$BACKUP_FILE" /tmp/backup.tar.gz \
                    --endpoint-url "$S3_ENDPOINT" --region "$S3_REGION"

                  echo "Extracting backup..."
                  tar xzf /tmp/backup.tar.gz -C /tmp

                  # Restore database
                  echo "Dropping and recreating database..."
                  mysql -h "{{ .Release.Name }}-mariadb" -u nextcloud -p"$DB_PASS" \
                    -e "DROP DATABASE IF EXISTS nextcloud; CREATE DATABASE nextcloud;"

                  echo "Importing database..."
                  mysql -h "{{ .Release.Name }}-mariadb" -u nextcloud -p"$DB_PASS" nextcloud < /tmp/nextcloud.sql

                  echo "Clearing stale text editor sessions..."
                  mysql -h "{{ .Release.Name }}-mariadb" -u nextcloud -p"$DB_PASS" nextcloud \
                    -e "TRUNCATE oc_text_steps; TRUNCATE oc_text_sessions; TRUNCATE oc_text_documents;"

                  # Restore config.php
                  echo "Restoring config.php..."
                  mkdir -p /nextcloud-data/config
                  cp /tmp/config.php /nextcloud-data/config/config.php
                  sed -i "s|'dbpassword' =>.*|'dbpassword' => '$DB_PASS',|" /nextcloud-data/config/config.php

                  echo "Patching SMTP credentials in config.php..."
                  sed -i "s|'mail_smtphost' =>.*|'mail_smtphost' => '$SMTP_HOST',|" /nextcloud-data/config/config.php
                  sed -i "s|'mail_smtpname' =>.*|'mail_smtpname' => '$SMTP_USER',|" /nextcloud-data/config/config.php
                  sed -i "s|'mail_smtppassword' =>.*|'mail_smtppassword' => '$SMTP_PASS',|" /nextcloud-data/config/config.php
                  chown 33:33 /nextcloud-data/config/config.php

                  # Restore user data
                  if [ -f /tmp/userdata.tar.gz ]; then
                    echo "Wiping existing user data..."
                    rm -rf /nextcloud-data/data
                    echo "Restoring user data..."
                    mkdir -p /nextcloud-data/data
                    tar xzf /tmp/userdata.tar.gz -C /nextcloud-data/data
                    chown -R 33:33 /nextcloud-data/data
                  else
                    echo "No user data in backup, creating data directory marker..."
                    mkdir -p /nextcloud-data/data
                    echo "# Nextcloud data directory" > /nextcloud-data/data/.ncdata
                    chown 33:33 /nextcloud-data/data /nextcloud-data/data/.ncdata
                  fi

                  echo "Resetting MariaDB user password to match secret..."
                  mysql -h "{{ .Release.Name }}-mariadb" -u root -p"$DB_ROOT_PASS" \
                    -e "ALTER USER 'nextcloud'@'%' IDENTIFIED BY '$DB_PASS'; FLUSH PRIVILEGES;"

                  if [ -n "$OAUTH_CLIENT_ID" ] && [ -n "$OAUTH_SECRET" ]; then
                    echo "Re-registering ArgoCD OIDC client..."
                    mysql -h "{{ .Release.Name }}-mariadb" -u nextcloud -p"$DB_PASS" nextcloud \
                      -e "DELETE r FROM oc_oidc_redirect_uris r JOIN oc_oidc_clients c ON r.client_id = c.id WHERE c.name = 'ArgoCD';"
                    mysql -h "{{ .Release.Name }}-mariadb" -u nextcloud -p"$DB_PASS" nextcloud \
                      -e "DELETE FROM oc_oidc_clients WHERE name = 'ArgoCD';"
                    mysql -h "{{ .Release.Name }}-mariadb" -u nextcloud -p"$DB_PASS" nextcloud \
                      -e "DELETE FROM oc_oauth2_clients WHERE name = 'ArgoCD';"
                    mysql -h "{{ .Release.Name }}-mariadb" -u nextcloud -p"$DB_PASS" nextcloud \
                      -e "INSERT INTO oc_oidc_clients (name, client_identifier, secret, signing_alg, type, flow_type, issued_at) VALUES ('ArgoCD', '$OAUTH_CLIENT_ID', '$OAUTH_SECRET', 'RS256', 'confidential', 'code', UNIX_TIMESTAMP());"
                    OIDC_CLIENT_ID=$(mysql -h "{{ .Release.Name }}-mariadb" -u nextcloud -p"$DB_PASS" nextcloud -N \
                      -e "SELECT id FROM oc_oidc_clients WHERE name = 'ArgoCD';")
                    mysql -h "{{ .Release.Name }}-mariadb" -u nextcloud -p"$DB_PASS" nextcloud \
                      -e "INSERT INTO oc_oidc_redirect_uris (client_id, redirect_uri) VALUES ($OIDC_CLIENT_ID, 'https://argocd.balve.garmeres.com/api/dex/callback');"
                    echo "ArgoCD OIDC client registered."
                  else
                    echo "Skipping OIDC registration (argocd-oauth secret not found)."
                  fi

                  echo "Restore complete. Scale the deployment back up."
              env:
                - name: RESTORE_DATE
                  value: "latest"
                - name: DB_PASS
                  valueFrom:
                    secretKeyRef:
                      name: "{{ .Release.Name }}-mariadb"
                      key: mariadb-password
                - name: DB_ROOT_PASS
                  valueFrom:
                    secretKeyRef:
                      name: "{{ .Release.Name }}-mariadb"
                      key: mariadb-root-password
                - name: SMTP_HOST
                  valueFrom:
                    secretKeyRef:
                      name: nextcloud-admin
                      key: smtp-host
                - name: SMTP_USER
                  valueFrom:
                    secretKeyRef:
                      name: nextcloud-admin
                      key: smtp-username
                - name: SMTP_PASS
                  valueFrom:
                    secretKeyRef:
                      name: nextcloud-admin
                      key: smtp-password
                - name: OAUTH_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: argocd-oauth
                      key: clientID
                      optional: true
                - name: OAUTH_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: argocd-oauth
                      key: clientSecret
                      optional: true
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backupS3.existingSecret }}
                      key: {{ .Values.backupS3.secretKeys.accessKey }}
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backupS3.existingSecret }}
                      key: {{ .Values.backupS3.secretKeys.secretKey }}
              volumeMounts:
                - name: nextcloud-data
                  mountPath: /nextcloud-data
              resources:
                requests:
                  memory: 512Mi
                  cpu: 50m
                limits:
                  memory: 512Mi
                  cpu: 500m
          volumes:
            - name: nextcloud-data
              persistentVolumeClaim:
                claimName: nextcloud-nextcloud
