apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-backup
spec:
  schedule: {{ .Values.backupSchedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: nextcloud-backup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: alpine:3.20
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  S3_ENDPOINT="https://{{ .Values.backupS3.host }}"
                  S3_REGION="{{ .Values.backupS3.region }}"
                  BUCKET="s3://{{ .Values.backupS3.bucket }}/backups"
                  TODAY=$(date +%Y%m%d)
                  apk add --no-cache mariadb-client aws-cli

                  # Database dump
                  echo "Backing up database..."
                  mysqldump --single-transaction \
                    -h "{{ .Release.Name }}-mariadb" -u nextcloud -p"$DB_PASS" nextcloud > /tmp/nextcloud.sql

                  # Config
                  echo "Backing up config.php..."
                  cp /nextcloud-data/config/config.php /tmp/config.php

                  # Package and upload
                  tar czf /tmp/nextcloud-backup-$TODAY.tar.gz -C /tmp nextcloud.sql config.php
                  aws s3 cp /tmp/nextcloud-backup-$TODAY.tar.gz "$BUCKET/nextcloud-backup-$TODAY.tar.gz" \
                    --endpoint-url "$S3_ENDPOINT" --region "$S3_REGION"

                  # Clean up old backups (best-effort — runs only after successful backup)
                  # Keep the 14 newest backups, delete the rest
                  echo "Cleaning up old backups..."
                  set +e
                  aws s3 ls "$BUCKET/" --endpoint-url "$S3_ENDPOINT" --region "$S3_REGION" | \
                    awk '{print $4}' | grep '^nextcloud-backup-' | sort -r | tail -n +15 | while read -r file; do
                    echo "Deleting old backup: $file"
                    aws s3 rm "$BUCKET/$file" --endpoint-url "$S3_ENDPOINT" --region "$S3_REGION"
                  done

                  echo "Done."
              env:
                - name: DB_PASS
                  valueFrom:
                    secretKeyRef:
                      name: "{{ .Release.Name }}-mariadb"
                      key: mariadb-password
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backupS3.existingSecret }}
                      key: {{ .Values.backupS3.secretKeys.accessKey }}
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backupS3.existingSecret }}
                      key: {{ .Values.backupS3.secretKeys.secretKey }}
              volumeMounts:
                - name: nextcloud-data
                  mountPath: /nextcloud-data
                  readOnly: true
              resources:
                requests:
                  memory: 64Mi
                  cpu: 50m
                limits:
                  memory: 256Mi
                  cpu: 200m
          volumes:
            - name: nextcloud-data
              persistentVolumeClaim:
                claimName: nextcloud-nextcloud
