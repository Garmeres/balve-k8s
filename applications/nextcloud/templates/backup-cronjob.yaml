apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-db-backup
spec:
  schedule: {{ .Values.backupSchedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: nextcloud-db-backup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: alpine:3.20
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  S3_ENDPOINT="https://{{ .Values.nextcloud.nextcloud.objectStore.s3.host }}"
                  S3_REGION="{{ .Values.nextcloud.nextcloud.objectStore.s3.region }}"
                  BUCKET="s3://{{ .Values.nextcloud.nextcloud.objectStore.s3.bucket }}/backups"
                  apk add --no-cache mariadb-client aws-cli

                  # Clean up old backups first (idempotent — safe to re-run on retry)
                  echo "Cleaning up backups older than 28 days..."
                  CUTOFF=$(date -u -d "-28 days" +%Y%m%d 2>/dev/null || date -u -v-28d +%Y%m%d)
                  aws s3 ls "$BUCKET/" --endpoint-url "$S3_ENDPOINT" --region "$S3_REGION" | \
                    awk '{print $4}' | grep '^nextcloud-' | while read -r file; do
                      file_date=$(echo "$file" | sed 's/nextcloud-\([0-9]\{8\}\).*/\1/')
                      if [ "$file_date" -lt "$CUTOFF" ] 2>/dev/null; then
                        echo "Deleting old backup: $file"
                        aws s3 rm "$BUCKET/$file" --endpoint-url "$S3_ENDPOINT" --region "$S3_REGION"
                      fi
                    done

                  # Fixed daily filename — retries overwrite the same file
                  echo "Creating backup..."
                  mysqldump -h "{{ .Release.Name }}-mariadb" -u nextcloud -p"$DB_PASS" nextcloud | gzip | \
                    aws s3 cp - "$BUCKET/nextcloud-$(date +%Y%m%d).sql.gz" \
                      --endpoint-url "$S3_ENDPOINT" --region "$S3_REGION"
                  echo "Done."
              env:
                - name: DB_PASS
                  valueFrom:
                    secretKeyRef:
                      name: "{{ .Release.Name }}-mariadb"
                      key: mariadb-password
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.nextcloud.nextcloud.objectStore.s3.existingSecret }}
                      key: {{ .Values.nextcloud.nextcloud.objectStore.s3.secretKeys.accessKey }}
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.nextcloud.nextcloud.objectStore.s3.existingSecret }}
                      key: {{ .Values.nextcloud.nextcloud.objectStore.s3.secretKeys.secretKey }}
              resources:
                requests:
                  memory: 64Mi
                  cpu: 50m
                limits:
                  memory: 256Mi
                  cpu: 200m
