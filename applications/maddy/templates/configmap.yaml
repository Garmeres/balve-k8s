apiVersion: v1
kind: ConfigMap
metadata:
  name: maddy-config
data:
  maddy.conf: |
    # Maddy mail relay — outbound only with DKIM signing
    # No IMAP, no inbound SMTP, no local storage

    $(hostname) = {{ .Values.hostname }}
    $(primary_domain) = {{ .Values.domain }}

    # TLS is not needed for submission from within the cluster.
    # Nextcloud connects via plain SMTP on port 587 over the pod network.
    tls off

    # Outbound delivery target — delivers directly to recipient MX servers
    target.remote outbound_delivery {
        limits {
            destination rate 10 1s
            destination concurrency 5
        }
        mx_auth {
            mtasts {
                cache fs
                fs_dir /data/mtasts_cache/
            }
            local_policy {
                min_tls_level encrypted
                min_mx_level none
            }
        }
    }

    # Outbound queue
    target.queue remote_queue {
        target &outbound_delivery
        autogenerated_msg_domain $(primary_domain)
        bounce {
            default_destination {
                reject 550 5.0.0 "Bounce rejected"
            }
        }
    }

    # Submission endpoint — no auth required (cluster-internal only)
    smtp tcp://0.0.0.0:587 {
        limits {
            all rate 50 1s
        }

        # No authentication — this is only exposed within the cluster
        default_source {
            default_destination {
                modify {
                    dkim {
                        domains $(primary_domain)
                        selector default
                        key_path /data/dkim_keys/{domain}_{selector}.key
                    }
                }
                deliver_to &remote_queue
            }
        }
    }

    hostname $(hostname)
