apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: garmeres-frontend
spec:
  podSelector:
    matchLabels:
      app: garmeres-frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 3000
          protocol: TCP
  egress:
    # DNS resolution (CoreDNS only)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Strapi API (for /api/blog-posts and dynamic home page)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: strapi
      ports:
        - port: 1337
          protocol: TCP
    # HTTPS (calendar data from external S3)
    - ports:
        - port: 443
          protocol: TCP
