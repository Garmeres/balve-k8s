apiVersion: apps/v1
kind: Deployment
metadata:
  name: garmeres-frontend
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: garmeres-frontend
  template:
    metadata:
      labels:
        app: garmeres-frontend
    spec:
      automountServiceAccountToken: false
      containers:
        - name: garmeres-frontend
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
            - name: STRAPI_URL
              value: {{ .Values.strapiUrl | quote }}
            - name: STRAPI_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appSecret }}
                  key: STRAPI_API_TOKEN
            - name: CALENDAR_URL
              value: {{ .Values.calendarUrl | quote }}
            - name: SITE_URL
              value: "https://{{ .Values.host }}"
            - name: NEXT_PUBLIC_GA_ID
              value: {{ .Values.gaId | quote }}
          startupProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
