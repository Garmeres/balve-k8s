apiVersion: batch/v1
kind: CronJob
metadata:
  name: strapi-db-backup
spec:
  schedule: "0 23 1-29/2 * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: strapi-db-backup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: alpine:3.20
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  S3_ENDPOINT="{{ .Values.s3.endpoint }}"
                  S3_REGION="{{ .Values.s3.region }}"
                  BUCKET="s3://{{ .Values.s3.bucket }}/backups"
                  apk add --no-cache sqlite aws-cli

                  # Clean up old backups (keep 28 days)
                  echo "Cleaning up backups older than 28 days..."
                  CUTOFF=$(date -u -d "-28 days" +%Y%m%d 2>/dev/null || date -u -v-28d +%Y%m%d)
                  aws s3 ls "$BUCKET/" --endpoint-url "$S3_ENDPOINT" --region "$S3_REGION" | \
                    awk '{print $4}' | grep '^strapi-' | while read -r file; do
                      file_date=$(echo "$file" | sed 's/strapi-\([0-9]\{8\}\).*/\1/')
                      if [ "$file_date" -lt "$CUTOFF" ] 2>/dev/null; then
                        echo "Deleting old backup: $file"
                        aws s3 rm "$BUCKET/$file" --endpoint-url "$S3_ENDPOINT" --region "$S3_REGION"
                      fi
                    done

                  # Create a consistent backup using sqlite3 .backup
                  echo "Creating backup..."
                  sqlite3 /data/data.db ".backup '/tmp/backup.db'"
                  gzip /tmp/backup.db
                  aws s3 cp /tmp/backup.db.gz "$BUCKET/strapi-$(date +%Y%m%d).db.gz" \
                    --endpoint-url "$S3_ENDPOINT" --region "$S3_REGION"
                  echo "Done."
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.s3Secret }}
                      key: S3_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.s3Secret }}
                      key: S3_SECRET_ACCESS_KEY
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
              resources:
                requests:
                  memory: 64Mi
                  cpu: 50m
                limits:
                  memory: 256Mi
                  cpu: 200m
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: strapi-data
