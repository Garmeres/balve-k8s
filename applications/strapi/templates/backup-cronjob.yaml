apiVersion: batch/v1
kind: CronJob
metadata:
  name: strapi-backup
spec:
  schedule: {{ .Values.backupSchedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: strapi-backup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: alpine:3.20
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  S3_ENDPOINT="{{ .Values.s3.endpoint }}"
                  S3_REGION="{{ .Values.s3.region }}"
                  BUCKET="s3://{{ .Values.s3.bucket }}/backups"
                  TODAY=$(date +%Y%m%d)
                  apk add --no-cache sqlite aws-cli

                  # Create a consistent backup using sqlite3 .backup
                  echo "Backing up database..."
                  sqlite3 /data/data.db ".backup '/tmp/backup.db'"
                  gzip /tmp/backup.db
                  aws s3 cp /tmp/backup.db.gz "$BUCKET/strapi-backup-$TODAY.db.gz" \
                    --endpoint-url "$S3_ENDPOINT" --region "$S3_REGION"

                  # Clean up old backups (best-effort — runs only after successful backup)
                  # Keep the 14 newest backups, delete the rest
                  echo "Cleaning up old backups..."
                  set +e
                  aws s3 ls "$BUCKET/" --endpoint-url "$S3_ENDPOINT" --region "$S3_REGION" | \
                    awk '{print $4}' | grep '^strapi-backup-' | sort -r | tail -n +15 | while read -r file; do
                    echo "Deleting old backup: $file"
                    aws s3 rm "$BUCKET/$file" --endpoint-url "$S3_ENDPOINT" --region "$S3_REGION"
                  done

                  echo "Done."
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.s3Secret }}
                      key: S3_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.s3Secret }}
                      key: S3_SECRET_ACCESS_KEY
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
              resources:
                requests:
                  memory: 64Mi
                  cpu: 50m
                limits:
                  memory: 256Mi
                  cpu: 200m
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: strapi-data
