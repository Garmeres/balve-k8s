apiVersion: batch/v1
kind: CronJob
metadata:
  name: strapi-db-restore
spec:
  suspend: true
  schedule: "0 0 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: strapi-db-restore
        spec:
          restartPolicy: Never
          containers:
            - name: restore
              image: alpine:3.20
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  S3_ENDPOINT="{{ .Values.s3.endpoint }}"
                  S3_REGION="{{ .Values.s3.region }}"
                  BUCKET="s3://{{ .Values.s3.bucket }}/backups"
                  apk add --no-cache aws-cli

                  echo "Available backups:"
                  aws s3 ls "$BUCKET/" --endpoint-url "$S3_ENDPOINT" --region "$S3_REGION" | grep 'strapi-'

                  if [ "$BACKUP_FILE" = "latest" ]; then
                    BACKUP_FILE=$(aws s3 ls "$BUCKET/" --endpoint-url "$S3_ENDPOINT" --region "$S3_REGION" | \
                      awk '{print $4}' | grep '^strapi-' | sort | tail -1)
                  fi

                  if [ -z "$BACKUP_FILE" ]; then
                    echo "ERROR: No backups found!"
                    exit 1
                  fi

                  echo "Restoring from: $BACKUP_FILE"
                  aws s3 cp "$BUCKET/$BACKUP_FILE" /tmp/backup.db.gz \
                    --endpoint-url "$S3_ENDPOINT" --region "$S3_REGION"
                  gunzip /tmp/backup.db.gz

                  # Replace the database
                  rm -f /data/data.db /data/data.db-shm /data/data.db-wal
                  mv /tmp/backup.db /data/data.db
                  echo "Restore complete. Scale the deployment back up."
              env:
                - name: BACKUP_FILE
                  value: "latest"
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.s3Secret }}
                      key: S3_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.s3Secret }}
                      key: S3_SECRET_ACCESS_KEY
              volumeMounts:
                - name: data
                  mountPath: /data
              resources:
                requests:
                  memory: 64Mi
                  cpu: 50m
                limits:
                  memory: 256Mi
                  cpu: 200m
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: strapi-data
