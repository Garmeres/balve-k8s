apiVersion: apps/v1
kind: Deployment
metadata:
  name: strapi
spec:
  replicas: 1
  revisionHistoryLimit: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: strapi
  template:
    metadata:
      labels:
        app: strapi
    spec:
      containers:
        - name: strapi
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          ports:
            - containerPort: 1337
              name: http
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "1337"
            - name: DATABASE_CLIENT
              value: "sqlite"
            - name: DATABASE_FILENAME
              value: "/data/data.db"
            - name: NODE_ENV
              value: "production"
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.secretRef }}
                  key: S3_ACCESS_KEY_ID
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.secretRef }}
                  key: S3_SECRET_ACCESS_KEY
            - name: S3_ENDPOINT
              value: {{ .Values.s3.endpoint | quote }}
            - name: S3_REGION
              value: {{ .Values.s3.region | quote }}
            - name: S3_BUCKET
              value: {{ .Values.s3.bucket | quote }}
            - name: S3_CDN_URL
              value: {{ .Values.s3.cdnUrl | quote }}
            - name: APP_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appSecret }}
                  key: APP_KEYS
            - name: API_TOKEN_SALT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appSecret }}
                  key: API_TOKEN_SALT
            - name: ADMIN_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appSecret }}
                  key: ADMIN_JWT_SECRET
            - name: TRANSFER_TOKEN_SALT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appSecret }}
                  key: TRANSFER_TOKEN_SALT
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appSecret }}
                  key: ENCRYPTION_KEY
            - name: SMTP_HOST
              value: {{ .Values.smtp.host | quote }}
            - name: SMTP_PORT
              value: {{ .Values.smtp.port | quote }}
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.smtp.secretRef }}
                  key: SMTP_USERNAME
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.smtp.secretRef }}
                  key: SMTP_PASSWORD
            - name: FRAME_ANCESTORS
              value: {{ .Values.frameAncestors | quote }}
          startupProbe:
            httpGet:
              path: /_health
              port: 1337
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /_health
              port: 1337
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /_health
              port: 1337
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: strapi-data
