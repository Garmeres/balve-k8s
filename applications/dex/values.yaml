dex:
  config:
    issuer: https://dex.balve.garmeres.com

    storage:
      type: kubernetes
      config:
        inCluster: true

    connectors:
      # GitHub — always available, works without Nextcloud
      - type: github
        id: github
        name: GitHub
        config:
          clientID: $GITHUB_CLIENT_ID
          clientSecret: $GITHUB_CLIENT_SECRET
          orgs:
            - name: Garmeres
          loadAllGroups: true
          claimModifications:
            modifyGroupNames:
              prefix: "github:"

      # Nextcloud — optional, works when Nextcloud is deployed
      - type: oidc
        id: nextcloud
        name: Nextcloud
        config:
          issuer: https://balve.garmeres.com
          clientID: $NEXTCLOUD_CLIENT_ID
          clientSecret: $NEXTCLOUD_CLIENT_SECRET
          scopes:
            - openid
            - profile
            - email
            - groups
          getUserInfo: true
          insecureEnableGroups: true
          claimMapping:
            groups: nc_groups
          claimModifications:
            modifyGroupNames:
              prefix: "nextcloud:"

    staticClients:
      - id: argocd
        name: ArgoCD
        redirectURIs:
          - https://argocd.balve.garmeres.com/api/dex/callback
        secretEnv: ARGOCD_CLIENT_SECRET

      - id: grafana
        name: Grafana
        redirectURIs:
          - https://grafana.balve.garmeres.com/login/generic_oauth
        secretEnv: GRAFANA_CLIENT_SECRET

  envVars:
    # GitHub connector credentials (required)
    - name: GITHUB_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: dex-github-connector
          key: clientID
    - name: GITHUB_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: dex-github-connector
          key: clientSecret

    # Nextcloud connector credentials (optional — Dex starts without them)
    - name: NEXTCLOUD_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: dex-nextcloud-connector
          key: clientID
          optional: true
    - name: NEXTCLOUD_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: dex-nextcloud-connector
          key: clientSecret
          optional: true

    # Static client secrets (generated by PreSync jobs)
    - name: ARGOCD_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: dex-argocd-client-secret
          key: client-secret
    - name: GRAFANA_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: dex-grafana-client-secret
          key: client-secret

  ingress:
    enabled: true
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      traefik.io/middlewares: dex-dex-headers@kubernetescrd
    hosts:
      - host: dex.balve.garmeres.com
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - secretName: dex-tls
        hosts:
          - dex.balve.garmeres.com

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

secret-mirror:
  mirrors:
    - source:
        namespace: dex
        secretName: dex-argocd-client-secret
      target:
        namespace: argocd
        secretName: dex-argocd-client-secret
    - source:
        namespace: dex
        secretName: dex-grafana-client-secret
      target:
        namespace: observability
        secretName: dex-grafana-client-secret
