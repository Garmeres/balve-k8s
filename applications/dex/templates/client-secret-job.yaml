{{- range .Values.dex.config.staticClients }}
{{- $secretName := printf "dex-%s-client-secret" .id }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $secretName }}-gen
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $secretName }}-gen
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $secretName | quote }}]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $secretName }}-gen
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
subjects:
  - kind: ServiceAccount
    name: {{ $secretName }}-gen
roleRef:
  kind: Role
  name: {{ $secretName }}-gen
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $secretName }}-gen
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    metadata:
      labels:
        app: {{ $secretName }}-gen
    spec:
      serviceAccountName: {{ $secretName }}-gen
      restartPolicy: Never
      containers:
        - name: generate
          image: bitnami/kubectl:1.32
          command:
            - /bin/sh
            - -c
            - |
              set -e
              if kubectl get secret "$SECRET_NAME" -n "$NAMESPACE" > /dev/null 2>&1; then
                echo "Secret $SECRET_NAME already exists, skipping."
                exit 0
              fi

              echo "Generating secret $SECRET_NAME..."
              kubectl create secret generic "$SECRET_NAME" \
                -n "$NAMESPACE" \
                --from-literal=client-secret="$(head -c 32 /dev/urandom | base64)"

              echo "Secret $SECRET_NAME created."
          env:
            - name: SECRET_NAME
              value: {{ $secretName | quote }}
            - name: NAMESPACE
              value: {{ $.Release.Namespace | quote }}
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
{{- end }}
