{{- range .Values.targets }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: calendar-sync-{{ .name }}
spec:
  schedule: {{ .schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: sync
              image: python:3.12-alpine
              command:
                - /bin/sh
                - -c
                - pip install --no-cache-dir icalendar recurring-ical-events python-dateutil boto3 && python /scripts/sync.py
              env:
                - name: CALENDAR_LINK
                  value: {{ $.Values.calendarLink | quote }}
                - name: BUCKET_NAME
                  value: {{ .s3.bucket | quote }}
                - name: S3_ENDPOINT
                  value: {{ .s3.endpoint | quote }}
                - name: S3_REGION
                  value: {{ .s3.region | quote }}
                - name: EVENTS_PER_PAGE
                  value: {{ $.Values.eventsPerPage | quote }}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .s3Secret }}
                      key: S3_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .s3Secret }}
                      key: S3_SECRET_ACCESS_KEY
                {{- if .cloudfrontDistributionId }}
                - name: DISTRIBUTION_ID
                  value: {{ .cloudfrontDistributionId | quote }}
                {{- end }}
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
              resources:
                requests:
                  memory: 64Mi
                  cpu: 50m
                limits:
                  memory: 256Mi
                  cpu: 200m
          volumes:
            - name: scripts
              configMap:
                name: calendar-sync-script
---
{{- end }}
