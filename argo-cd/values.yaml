argo-cd:
  global:
    domain: argocd.balve.garmeres.com

  server:
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        traefik.io/middlewares: argocd-argocd-chain@kubernetescrd
      tls: true

  dex:
    enabled: false

  configs:
    cm:
      admin.enabled: "false"
      url: https://argocd.balve.garmeres.com
      ui.theme: auto
      ui.bannercontent: "This dashboard shows the status of all services on the Balve server. Green means everything is running normally."
      ui.bannerposition: top
      ui.bannerpermanent: "true"
      oidc.config: |
        name: Dex
        issuer: https://dex.balve.garmeres.com
        clientID: argocd
        clientSecret: $dex-argocd-client-secret:client-secret
        requestedScopes:
          - openid
          - profile
          - email
          - groups

    rbac:
      scopes: "[groups]"
      policy.default: role:viewer
      policy.csv: |
        p, role:viewer, applications, get, */*, allow
        p, role:viewer, logs, get, */*, deny
        p, role:viewer, exec, create, */*, deny
        p, role:viewer, repositories, *, *, deny
        p, role:viewer, clusters, *, *, deny
        p, role:viewer, certificates, *, *, deny
        p, role:viewer, accounts, *, *, deny
        p, role:viewer, gpgkeys, *, *, deny
        p, role:viewer, projects, *, *, deny
        p, role:viewer, extensions, invoke, */*, deny
        p, role:developer, applications, get, */*, allow
        p, role:developer, applications, sync, */*, allow
        p, role:developer, applications, action/*, */*, allow
        p, role:developer, applications, sync, default/argocd, deny
        p, role:developer, applications, action/*, default/argocd, deny
        p, role:developer, logs, get, */*, allow
        p, role:developer, exec, create, */*, deny
        p, role:developer, repositories, get, *, allow
        p, role:developer, clusters, get, *, allow
        p, role:developer, certificates, get, *, allow
        p, role:developer, projects, get, *, allow
        p, role:developer, accounts, *, *, deny
        p, role:developer, gpgkeys, *, *, deny
        p, role:developer, extensions, invoke, */*, deny
        g, github:Garmeres:admins, role:admin
        g, github:Garmeres:developers, role:developer
        g, nextcloud:Garmeres board, role:developer

    params:
      server.insecure: true
      server.x.frame.options: "SAMEORIGIN"
      server.content.security.policy: "frame-ancestors 'self' https://balve.garmeres.com"
