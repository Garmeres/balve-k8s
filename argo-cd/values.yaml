argo-cd:
  global:
    domain: argocd.balve.garmeres.com

  server:
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        traefik.io/middlewares: argocd-argocd-rate-limit@kubernetescrd
      tls: true

  dex:
    enabled: true

  configs:
    cm:
      admin.enabled: "false"
      url: https://argocd.balve.garmeres.com
      ui.theme: auto
      users.anonymous.enabled: "true"
      ui.bannercontent: "This dashboard shows the health status of the Balve platform. Log in at https://argocd.balve.garmeres.com/login for full access."
      ui.bannerpermanent: "true"
      ui.bannerposition: "top"
      dex.config: |
        connectors:
          - type: github
            id: github
            name: GitHub
            config:
              clientID: $argocd-dex-github:clientID
              clientSecret: $argocd-dex-github:clientSecret
              orgs:
                - name: Garmeres
              loadAllGroups: true

    rbac:
      policy.default: role:anonymous
      policy.csv: |
        p, role:anonymous, applications, get, */*, allow
        p, role:anonymous, logs, get, */*, deny
        p, role:anonymous, exec, create, */*, deny
        p, role:anonymous, repositories, *, *, deny
        p, role:anonymous, clusters, *, *, deny
        p, role:anonymous, certificates, *, *, deny
        p, role:anonymous, accounts, *, *, deny
        p, role:anonymous, gpgkeys, *, *, deny
        p, role:anonymous, projects, *, *, deny
        p, role:anonymous, extensions, invoke, */*, deny
        g, Garmeres:admins, role:admin
        g, Garmeres:developers, role:readonly

    params:
      server.insecure: true
      server.x.frame.options: "SAMEORIGIN"
      server.content.security.policy: "frame-ancestors 'self' https://balve.garmeres.com"
