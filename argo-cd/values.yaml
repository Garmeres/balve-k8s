argo-cd:
  global:
    domain: argocd.balve.garmeres.com

  server:
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
      tls: true

  dex:
    enabled: true

  configs:
    cm:
      admin.enabled: "false"
      url: https://argocd.balve.garmeres.com
      ui.theme: auto
      dex.config: |
        connectors:
          - type: github
            id: github
            name: GitHub
            config:
              clientID: $argocd-dex-github:clientID
              clientSecret: $argocd-dex-github:clientSecret
              orgs:
                - name: Garmeres
              loadAllGroups: true

    rbac:
      policy.default: role:readonly
      policy.csv: |
        g, Garmeres:admins, role:admin
        g, Garmeres:developers, role:readonly

    params:
      server.insecure: true
      server.x.frame.options: "SAMEORIGIN"
      server.content.security.policy: "frame-ancestors 'self' https://balve.garmeres.com"
